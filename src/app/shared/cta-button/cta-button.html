@if (type === 'submit') {
  <button
    type="submit"
    class="cta-button"
    [disabled]="disabled"
    (click)="onClick()">
    @if (translateKey) {
      {{ translateKey | translate }}
    } @else {
      {{ text }}
    }
  </button>
} @else {
  <a [href]="href" class="cta-button">
    @if (translateKey) {
      {{ translateKey | translate }}
    } @else {
      {{ text }}
    }
  </a>
}
